<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
  <style>
    @keyframes wave {
      0% {
        transform: translateX(0) scaleY(1);
      }
      50% {
        transform: translateX(-25%) scaleY(1.2);
      }
      100% {
        transform: translateX(0) scaleY(1);
      }
    }
    .wave1 {
      animation: wave 8s ease-in-out infinite;
      fill: #4a90e2;
      opacity: 0.5;
    }
    .wave2 {
      animation: wave 12s ease-in-out infinite reverse;
      fill: #50e3c2;
      opacity: 0.7;
    }
  </style>

  <!-- Фон -->
  <rect width="100%" height="100%" fill="#0f172a" />

  <!-- Хвиля 1 -->
  <path class="wave1" d="M0,192L48,176C96,160,192,128,288,138.7C384,149,480,203,576,208C672,213,768,171,864,149.3C960,128,1056,128,1152,149.3C1248,171,1344,213,1392,234.7L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>

  <!-- Хвиля 2 -->
  <path class="wave2" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,138.7C672,149,768,203,864,208C960,213,1056,171,1152,149.3C1248,128,1344,128,1392,128L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
</svg>
